<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>死角を狙え！シカ侍ゲーム</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#111;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;touch-action:manipulation}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
#app{width:min(100vw,720px);min-height:100vh;background:#111;display:flex;flex-direction:column}
#hud{height:58px;background:#222;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:800;letter-spacing:.04em}
#hud .score{font-size:20px}
#hud .score span{font-size:28px;margin-left:5px}
#hud .timer{font-size:18px}
#game{position:relative;width:100%;overflow:hidden;background:#cce;line-height:0}
#base{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.target{position:absolute;width:12%;aspect-ratio:1/1;border:0;padding:0;margin:0;background:transparent;display:none;cursor:pointer;z-index:5;touch-action:manipulation}
.target img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
#startScreen,#resultScreen{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.58);line-height:1.5}
.panel{width:82%;max-width:440px;background:rgba(255,255,255,.96);border-radius:20px;padding:25px 20px;text-align:center;box-shadow:0 10px 35px rgba(0,0,0,.35)}
.panel h1{font-size:25px;margin:0 0 12px;color:#222}
.panel p{font-size:16px;margin:8px 0;color:#333}
button.main{border:0;border-radius:14px;background:#222;color:#fff;font-size:20px;font-weight:800;padding:13px 28px;margin-top:14px;cursor:pointer}
#resultScore{font-size:40px;font-weight:900;margin:8px 0 2px}
#resultText{font-weight:700}
.small{font-size:13px!important;color:#666!important}
.hidden{display:none!important}
.flash{animation:flash .18s ease-out}
@keyframes flash{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}

.samurai-img{display:block;width:min(72%,330px);max-height:38vh;object-fit:contain;margin:0 auto 10px;border-radius:14px}
.result-samurai{width:min(58%,260px);max-height:31vh}
.outside-target{z-index:6}
.target img{transform:scale(2);transform-origin:center center;}

.slash-effect{
  position:absolute;
  z-index:12;
  width:32%;
  aspect-ratio:1/1;
  padding:0;
  margin:0;
  pointer-events:none;
  background:transparent;
  animation:slashEffect .24s ease-out forwards;
}
.slash-effect img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  user-select:none;
  pointer-events:none;
  transform:scale(1);
  transform-origin:center center;
}
.slash-effect.blue img{
  filter:hue-rotate(240deg) saturate(1.25);
}
@keyframes slashEffect{
  0%{opacity:0;transform:scale(.72)}
  15%{opacity:1;transform:scale(1)}
  100%{opacity:1;transform:scale(1)}
}
</style>
</head>

const targets=[...document.querySelectorAll(".target")];
const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const startScreen=document.getElementById("startScreen");
const resultScreen=document.getElementById("resultScreen");
const resultScore=document.getElementById("resultScore");
const resultText=document.getElementById("resultText");
let score=0, running=false, endAt=0, timerId=null, spawnTimer=null, hideTimer=null;
let cloudCount=0, current=null, nextCloudAt=0;

function setScore(v){
  score=v; scoreEl.textContent=v;
  scoreEl.classList.remove("flash"); void scoreEl.offsetWidth; scoreEl.classList.add("flash");
}

function hideTarget(){
  if(current){if(current.classList.contains("outside-target")) current.remove(); else current.style.display="none";}
  current=null;
  if(hideTimer){clearTimeout(hideTimer);hideTimer=null;}
}

const BASE_W=1080, BASE_H=1440;
const DARK=[97,116,126];
const LIGHT=[201,231,224];
const deadZones=[
  {x:0,y:200,w:396,h:288},
  {x:396,y:402,w:252,h:178},
  {x:648,y:180,w:432,h:320},
  {x:0,y:485,w:385,h:835},
  {x:655,y:500,w:425,h:820},
  {x:385,y:1315,w:310,h:125}
];
let baseCanvas=null,baseCtx=null,basePixels=null;

function prepareBaseMap(){
  if(baseCanvas)return;
  const img=document.getElementById("base");
  if(!img.complete || !img.naturalWidth)return;
  baseCanvas=document.createElement("canvas");
  baseCanvas.width=BASE_W;baseCanvas.height=BASE_H;
  baseCtx=baseCanvas.getContext("2d",{willReadFrequently:true});
  baseCtx.drawImage(img,0,0,BASE_W,BASE_H);
  basePixels=baseCtx.getImageData(0,0,BASE_W,BASE_H).data;
}

function nearColor(r,g,b,c,tol=18){
  return Math.hypot(r-c[0],g-c[1],b-c[2])<=tol;
}

// ターゲット画像の四隅＋内部を細かく検査し、
// 背景色以外（猫・自転車・車・トラック・文字・道路境界など）に
// 少しでも重なる候補は採用しない。
function fitsZone(x,y,zoneColor){
  prepareBaseMap();
  if(!baseCtx || !basePixels)return false;
  const size=BASE_W*0.12;
  const sx=x*BASE_W/100, sy=y*BASE_H/100;
  if(sx<0||sy<0||sx+size>BASE_W||sy+size>BASE_H)return false;
  const n=9;
  for(let gy=0;gy<n;gy++){
    for(let gx=0;gx<n;gx++){
      const px=Math.round(sx+(gx+0.5)*size/n);
      const py=Math.round(sy+(gy+0.5)*size/n);
      const idx=(py*BASE_W+px)*4;
      if(!nearColor(basePixels[idx],basePixels[idx+1],basePixels[idx+2],zoneColor))return false;
    }
  }
  return true;
}

function randomInDeadZone(){
  for(let tries=0;tries<300;tries++){
    const z=deadZones[Math.floor(Math.random()*deadZones.length)];
    const size=BASE_W*0.12;
    const xPx=z.x+Math.random()*Math.max(1,z.w-size);
    const yPx=z.y+Math.random()*Math.max(1,z.h-size);
    const x=xPx/BASE_W*100, y=yPx/BASE_H*100;
    if(fitsZone(x,y,DARK))return {x,y};
  }
  return null;
}

function randomOutsideDeadZone(){
  for(let tries=0;tries<800;tries++){
    const size=BASE_W*0.12;
    const x=(Math.random()*(BASE_W-size))/BASE_W*100;
    const y=(Math.random()*(BASE_H-size))/BASE_H*100;
    if(fitsZone(x,y,LIGHT))return {x,y};
  }
  return null;
}

function isOutsideDeadSpots(x,y){
  return fitsZone(x,y,LIGHT);
}

function showTarget(){
  if(!running)return;
  hideTarget();
  prepareBaseMap();
  if(!basePixels){spawnTimer=setTimeout(showTarget,100);return;}

  const outside=Math.random()<0.5;
  const pos=outside ? randomOutsideDeadZone() : randomInDeadZone();
  if(!pos){
    spawnTimer=setTimeout(showTarget,250);
    return;
  }

  let el;
  if(outside){
    el=document.createElement("button");
    el.className="target outside-target";
    el.style.left=pos.x+"%";
    el.style.top=pos.y+"%";
    el.setAttribute("aria-label","ターゲット");
    document.getElementById("game").appendChild(el);
  }else{
    const slot=Math.floor(Math.random()*targets.length);
    el=targets[slot];
    el.style.left=pos.x+"%";
    el.style.top=pos.y+"%";
  }

  const isCloud=(cloudCount<5 && performance.now()>=nextCloudAt);
  const img=document.createElement("img");
  img.src=isCloud?CLOUD:NINJA;
  img.alt=isCloud?"雲隠ドロン":"死角いニンジャ";
  el.replaceChildren(img);
  el.dataset.kind=isCloud?"cloud":"ninja";
  el.dataset.outside=outside?"1":"0";
  el.style.display="block";
  current=el;

  if(isCloud){
    cloudCount++;
    const remainingClouds=5-cloudCount;
    const remainingMs=Math.max(1000,endAt-performance.now());
    nextCloudAt=performance.now()+Math.max(850,remainingMs/(remainingClouds+1)*0.45);
  }
  hideTimer=setTimeout(()=>{if(el===current)hideTarget()},650+Math.random()*350);
  spawnTimer=setTimeout(showTarget,720+Math.random()*650);
}

function finish(){
  running=false;
  if(timerId)clearInterval(timerId);
  if(spawnTimer)clearTimeout(spawnTimer);
  if(hideTimer)clearTimeout(hideTimer);
  hideTarget();
  timeEl.textContent="0.0";
  resultScore.textContent=score+"点";
  if(score>=10) resultText.textContent="見事！死角を消す刺客「シカ侍」の腕前！";
  else if(score>=5) resultText.textContent="ナイス！もう一度ハイスコアを狙おう！";
  else resultText.textContent="お疲れさまでした！もう一度挑戦しよう！";
  resultScreen.classList.remove("hidden");
}


let audioCtx=null;

function playSlashSound(){
  try{
    const AC=window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!audioCtx) audioCtx=new AC();
    if(audioCtx.state==="suspended") audioCtx.resume();

    const now=audioCtx.currentTime;

    // 高めの「シュッ」
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type="sawtooth";
    osc.frequency.setValueAtTime(1250,now);
    osc.frequency.exponentialRampToValueAtTime(180,now+0.16);
    gain.gain.setValueAtTime(0.0001,now);
    gain.gain.exponentialRampToValueAtTime(0.20,now+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+0.17);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now+0.18);

    // 短いノイズ成分で「ビュッ」の勢いを追加
    const buffer=audioCtx.createBuffer(1,Math.floor(audioCtx.sampleRate*0.12),audioCtx.sampleRate);
    const data=buffer.getChannelData(0);
    for(let i=0;i<data.length;i++){
      const t=i/data.length;
      data[i]=(Math.random()*2-1)*(1-t);
    }
    const noise=audioCtx.createBufferSource();
    const filter=audioCtx.createBiquadFilter();
    const noiseGain=audioCtx.createGain();
    noise.buffer=buffer;
    filter.type="bandpass";
    filter.frequency.setValueAtTime(1800,now);
    filter.frequency.exponentialRampToValueAtTime(500,now+0.12);
    filter.Q.value=0.8;
    noiseGain.gain.setValueAtTime(0.0001,now);
    noiseGain.gain.exponentialRampToValueAtTime(0.12,now+0.005);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001,now+0.12);
    noise.connect(filter).connect(noiseGain).connect(audioCtx.destination);
    noise.start(now);
  }catch(e){}
}

function startGame(){
  score=0; scoreEl.textContent="0"; cloudCount=0; current=null;
  startScreen.classList.add("hidden");
  resultScreen.classList.add("hidden");
  running=true;
  endAt=performance.now()+30000;
  nextCloudAt=performance.now()+900;
  timeEl.textContent="30.0";
  showTarget();
  timerId=setInterval(()=>{
    const remain=Math.max(0,endAt-performance.now());
    timeEl.textContent=(remain/1000).toFixed(1);
    if(remain<=0) finish();
  },50);
}

function handleTargetTap(el,e){
  e.preventDefault();
  if(!running || el!==current)return;
  const kind=el.dataset.kind;
  const outside=el.dataset.outside==="1";
  const delta=outside ? (kind==="cloud" ? 2 : -1) : (kind==="cloud" ? -1 : 1);
  const isPositive=delta>0;
  showSlashEffect(el,isPositive);
  playSlashSound();
  setScore(score+delta);
  hideTarget();
}

function pointHitsCurrentTarget(clientX,clientY){
  if(!running || !current || current.style.display==="none")return false;
  const img=current.querySelector("img");
  if(!img)return false;
  const r=img.getBoundingClientRect();
  return clientX>=r.left && clientX<=r.right && clientY>=r.top && clientY<=r.bottom;
}
const gameEl=document.getElementById("game");
if("PointerEvent" in window){
  gameEl.addEventListener("pointerdown",e=>{
    if(pointHitsCurrentTarget(e.clientX,e.clientY)){
      e.preventDefault();
      handleTargetTap(current,e);
    }
  },{passive:false});
}else{
  gameEl.addEventListener("touchstart",e=>{
    const t=e.changedTouches[0];
    if(t && pointHitsCurrentTarget(t.clientX,t.clientY)){
      e.preventDefault();
      handleTargetTap(current,e);
    }
  },{passive:false});
}
targets.forEach(el=>el.addEventListener("click",e=>handleTargetTap(el,e)));
gameEl.addEventListener("click",e=>{
  const el=e.target.closest(".outside-target");
  if(el)handleTargetTap(el,e);
});

document.getElementById("base").addEventListener("load",prepareBaseMap);
prepareBaseMap();
document.getElementById("startBtn").addEventListener("click",()=>{ try{ const AC=window.AudioContext||window.webkitAudioContext; if(AC && !audioCtx) audioCtx=new AC(); if(audioCtx&&audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} startGame(); });
document.getElementById("againBtn").addEventListener("click",startGame);
</script>
</body>
